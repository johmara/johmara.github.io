<div class="publications-container">
  <div class="header">
    <h1 class="search-container title">All Publications</h1>
  </div>
  <div class="search-container">
    <input type="text" class="ds-input" #filterInput [(ngModel)]="searchQuery" (input)="search()" placeholder="Search publications..."/>
  </div>
  <table>
    <thead>
    <tr>
      <th (click)="setSortField('title')">Title <i class="fa" [ngClass]="getSortIcon('title')"></i></th>
      <th>Authors</th>
      <th (click)="setSortField('publishedIn')">Published In <i class="fa" [ngClass]="getSortIcon('publishedIn')"></i></th>
      <th (click)="setSortField('date')">Year <i class="fa" [ngClass]="getSortIcon('date')"></i></th>
      <th>Actions</th>
    </tr>
    </thead>
    <tbody>
    <tr *ngFor="let publication of filteredPublications">
      <td>
        <a *ngIf="publication.link; else noLink" [href]="publication.link" target="_blank">{{ publication.title }}</a>
        <ng-template #noLink>{{ publication.title }}</ng-template>
        <span *ngIf="publication.status === 'accepted'" class="ds-badge status-badge">Accepted</span>
      </td>
      <td>{{ publication.authors }}</td>
      <td><i class="fa fa-book" aria-hidden="true"></i> <em>{{ publication.publishedIn }}</em></td>
      <td>({{ publication.date | date:'yyyy' }})</td>
      <td>
        <button class="ds-btn" (click)="openAbstractView(publication)">ABS</button>
        <button class="ds-btn" (click)="openBibtexView(publication)">BIB</button>
        <button *ngIf="publication.link" class="ds-btn" (click)="openPdf(publication)">PDF</button>
      </td>
    </tr>
    </tbody>
  </table>
</div>
